<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 2분기 GWP 선물 대시보드</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>🎁 2026 2분기 GWP 선물 대시보드</h1>
      <p class="subtitle">2분기(4~6월) GWP 계획 · 선물 후보를 함께 등록하고 예산을 공유해요</p>
    </div>
  </header>

  <main class="wrap">
    <!-- 예산 요약 -->
    <section class="budget" aria-label="예산 현황">
      <div class="cards">
        <div class="card">
          <span class="card-label">총 예산</span>
          <strong class="card-value" id="b-total">–</strong>
          <span class="card-sub" id="b-formula">138명 × 2만원</span>
        </div>
        <div class="card">
          <span class="card-label">사용 금액</span>
          <strong class="card-value" id="b-spent">–</strong>
          <span class="card-sub" id="b-count">등록 0건</span>
        </div>
        <div class="card" id="card-remaining">
          <span class="card-label">잔여 예산</span>
          <strong class="card-value" id="b-remaining">–</strong>
          <span class="card-sub" id="b-status"> </span>
        </div>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="progress-text" id="progress-text"> </p>
    </section>

    <!-- 선물 추가 -->
    <section class="panel">
      <h2>선물 추가</h2>
      <p class="hint">등록 시 설정한 <strong>비밀번호</strong>를 알아야 본인 항목을 수정·삭제할 수 있어요.</p>
      <form id="add-form" class="gift-form" autocomplete="off">
        <div class="grid">
          <label class="field">
            <span>제품명 <em>*</em></span>
            <input type="text" name="name" maxlength="100" required placeholder="예: 텀블러 세트" />
          </label>
          <label class="field">
            <span>가격(원) <em>*</em></span>
            <input type="number" name="price" min="0" step="1" required placeholder="예: 15000" />
          </label>
          <label class="field">
            <span>수량</span>
            <input type="number" name="quantity" min="1" step="1" value="1" />
          </label>
          <label class="field">
            <span>등록자</span>
            <input type="text" name="registrant" maxlength="100" placeholder="이름(선택)" />
          </label>
          <label class="field field-wide">
            <span>구매 링크</span>
            <input type="url" name="url" maxlength="1000" placeholder="https://...(선택)" />
          </label>
          <label class="field field-wide">
            <span>메모</span>
            <input type="text" name="note" maxlength="500" placeholder="간단한 설명(선택)" />
          </label>
          <label class="field">
            <span>비밀번호 <em>*</em></span>
            <input type="password" name="password" maxlength="200" required placeholder="수정·삭제용 비밀번호" />
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">선물 등록</button>
          <span class="form-msg" id="add-msg"></span>
        </div>
      </form>
    </section>

    <!-- 선물 목록 -->
    <section class="panel">
      <h2>등록된 선물 <span class="count-badge" id="list-count">0</span></h2>
      <div id="gift-list" class="gift-list">
        <p class="empty" id="empty">아직 등록된 선물이 없어요. 첫 번째 후보를 추가해 보세요!</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">2026 2분기 GWP · 가용 예산 276만원 (138명 × 2만원)</div>
  </footer>

  <!-- 수정 모달 -->
  <div class="modal-overlay" id="edit-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <h3 id="edit-title">선물 수정</h3>
      <form id="edit-form" class="gift-form" autocomplete="off">
        <input type="hidden" name="id" />
        <div class="grid">
          <label class="field">
            <span>제품명 <em>*</em></span>
            <input type="text" name="name" maxlength="100" required />
          </label>
          <label class="field">
            <span>가격(원) <em>*</em></span>
            <input type="number" name="price" min="0" step="1" required />
          </label>
          <label class="field">
            <span>수량</span>
            <input type="number" name="quantity" min="1" step="1" />
          </label>
          <label class="field">
            <span>등록자</span>
            <input type="text" name="registrant" maxlength="100" />
          </label>
          <label class="field field-wide">
            <span>구매 링크</span>
            <input type="url" name="url" maxlength="1000" placeholder="https://..." />
          </label>
          <label class="field field-wide">
            <span>메모</span>
            <input type="text" name="note" maxlength="500" />
          </label>
          <label class="field">
            <span>비밀번호 <em>*</em></span>
            <input type="password" name="password" maxlength="200" required placeholder="등록 시 설정한 비밀번호" />
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">저장</button>
          <button type="button" class="btn btn-ghost" id="edit-cancel">취소</button>
          <span class="form-msg" id="edit-msg"></span>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
