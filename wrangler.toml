name = "gwp-2026-q2"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 정적 UI는 GitHub Pages(github.io)에서 서빙하고, 이 Worker는 /api/* (D1 데이터)만 담당한다.

# 예산 설정 (총 276만원 = 138명 × 2만원)
[vars]
TOTAL_BUDGET = "2760000"
HEADCOUNT = "138"
PER_PERSON = "20000"

# D1 데이터베이스 바인딩 (database_id는 프로비저닝 후 채움)
[[d1_databases]]
binding = "DB"
database_name = "gwp-2026-q2"
database_id = "efc9b4ff-b379-4dd8-bf68-e5cd85270258"
