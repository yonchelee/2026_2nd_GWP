name = "gwp-2026-q2"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 정적 UI는 GitHub Pages(github.io)에서 서빙하고, 이 Worker는 /api/* (D1 데이터)만 담당한다.

# 예산 설정: 행사비 인당 10만원, 그 중 20%(2만원)가 선물비.
# 선물 예산 = 파트별 당일 참석 인원 합계 × PER_PERSON_GIFT (동적)
[vars]
PER_PERSON_EVENT = "100000"
PER_PERSON_GIFT = "20000"
PLANNED_HEADCOUNT = "138"

# D1 데이터베이스 바인딩 (database_id는 프로비저닝 후 채움)
[[d1_databases]]
binding = "DB"
database_name = "gwp-2026-q2"
database_id = "efc9b4ff-b379-4dd8-bf68-e5cd85270258"
